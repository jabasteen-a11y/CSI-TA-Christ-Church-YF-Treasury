<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — CSITA Christ Church</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F1E6; --ink:#1B2A44; --cloth:#2F5233; --cloth-dark:#213B26;
    --rule-red:#B23A2E; --brass:#A9823D; --brass-soft:#C9A65F; --muted:#7A7266; --line:#D8D0BC;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;min-height:100vh;background:var(--cloth);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Sans',sans-serif;color:var(--ink);
    padding:24px;
  }

  .wrap{
    display:flex;
    width:100%;
    max-width:960px;
    min-height:480px;
    background:var(--paper);
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.28);
    border-top:4px solid var(--brass);
    opacity:0;
    transform:translateY(10px);
    animation:riseIn 0.5s ease-out forwards;
  }
  @keyframes riseIn{
    to{opacity:1;transform:translateY(0);}
  }

  /* LEFT: brand / logo panel */
  .brand-panel{
    flex:0 0 34%;
    background:var(--cloth);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:44px 30px;
    text-align:center;
    color:#F5F1E6;
  }
  .logo-ring{
    width:112px;height:112px;border-radius:50%;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
    margin-bottom:20px;
  }
  .logo-ring img{width:94px;height:94px;border-radius:50%;object-fit:cover;}
  .brand-title{
    font-family:'Fraunces',serif;font-weight:700;font-size:1.4rem;
    line-height:1.25;margin:0 0 8px;
  }
  .brand-sub{
    font-size:0.74rem;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--brass-soft);margin-bottom:18px;
  }
  .brand-rule{
    width:44px;height:2px;background:var(--brass-soft);opacity:0.7;
    margin:0 0 18px;
  }
  .brand-module{
    font-size:0.86rem;font-weight:500;color:#EDE7D6;
    max-width:200px;line-height:1.55;
  }

  /* MIDDLE: form panel */
  .form-panel{
    flex:1;
    display:flex;flex-direction:column;justify-content:center;
    background:var(--paper);
    padding:36px 40px;
  }
  .login-card{
    width:100%;max-width:280px;
    margin:0 auto;
    text-align:center;
  }
  h1{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600;margin:0 0 2px;color:var(--ink);}
  .sub{color:var(--muted);font-size:0.8rem;margin-bottom:24px;}
  label{display:block;text-align:left;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin:0 0 5px;}
  .field{margin-bottom:15px;text-align:left;}
  input{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:3px;
    background:#EFE9D8;color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:0.9rem;
    transition:border-color 0.15s, background 0.15s;
  }
  input:focus{
    outline:none;border-color:var(--brass);background:#FFFDF7;
  }
  .btn{
    width:100%;background:var(--cloth);color:#fff;border:none;padding:10px 20px;border-radius:3px;
    font-size:0.85rem;font-weight:600;cursor:pointer;letter-spacing:0.02em;
    transition:background 0.15s;
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin-top:4px;
  }
  .btn:hover{background:var(--cloth-dark);}
  .btn:disabled{opacity:0.6;cursor:default;}
  .spinner{
    width:13px;height:13px;border-radius:50%;
    border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;
    animation:spin 0.7s linear infinite;display:none;
  }
  .btn.loading .spinner{display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .login-err{
    color:var(--rule-red);font-size:0.8rem;margin-top:12px;min-height:1.1em;
  }
  .login-err.hidden{display:none;}

  /* RIGHT: church photo, full height */
  .church-panel{
    flex:0 0 30%;
    position:relative;
    overflow:hidden;
  }
  .church-panel img{
    width:100%;height:100%;object-fit:cover;object-position:center;
    display:block;
  }
  .church-panel::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(27,42,68,0.08), transparent 30%, transparent 70%, rgba(27,42,68,0.12));
  }

  @media (max-width: 760px){
    .wrap{flex-direction:column;min-height:0;max-width:380px;}
    .brand-panel{flex:none;padding:30px 28px;order:1;}
    .logo-ring{width:88px;height:88px;}
    .logo-ring img{width:72px;height:72px;}
    .church-panel{flex:none;height:130px;order:2;}
    .form-panel{padding:28px 28px;order:3;}
  }
</style>
</head>

<script>
/* Paste the same Apps Script Web App URL used in index.html */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzuDtVWlm1zl_9os_ovMgflRTnAAGE0aPblPXM-oQQVYDNqqFQqNd-senTOTa3LozxM/exec'
};

const SESSION_TOKEN_KEY = 'csita_treasury_token';
const SESSION_USER_KEY = 'csita_treasury_user';
const SESSION_ROLE_KEY = 'csita_treasury_role';

// already logged in? skip straight to the app
if (localStorage.getItem(SESSION_TOKEN_KEY)) {
  window.location.href = 'index.html';
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const err = document.getElementById('login-err');
  const btn = document.getElementById('login-btn');
  const btnText = btn.querySelector('.btn-text');
  err.classList.add('hidden');
  err.textContent = '';

  if (!CONFIG.API_URL || CONFIG.API_URL.indexOf('PASTE_YOUR') === 0) {
    err.textContent = 'API_URL not configured yet in login.html.';
    err.classList.remove('hidden');
    return;
  }

  btn.disabled = true; btn.classList.add('loading'); btnText.textContent = 'Logging in…';
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'login', username, password })
    });
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem(SESSION_TOKEN_KEY, data.token);
      localStorage.setItem(SESSION_USER_KEY, data.username);
      localStorage.setItem(SESSION_ROLE_KEY, data.role);
      window.location.href = 'index.html';
    } else {
      err.textContent = data.error || 'Login failed.';
      err.classList.remove('hidden');
    }
  } catch (ex) {
    err.textContent = 'Could not reach the server. Check your connection.';
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.classList.remove('loading'); btnText.textContent = 'Log in';
  }
});
</script>
</body>
</html>
